# No database is provisioned here: use the team's existing Supabase project.
services:
  - type: web
    name: meu-controle-financeiro-api
    runtime: node
    plan: free
    branch: develop
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PATH
        value: /etc/secrets/supabase-ca.crt
